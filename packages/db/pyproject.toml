[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeworld-db"
version = "0.1.0"
description = "CodeWorld shared database models and enums"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["codeworld_db*"]
