# Alembic Configuration File
# This file is used by Alembic to manage database migrations.
# Documentation: https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names.
# %(rev)s = revision ID, %(slug)s = first part of the message
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

# SQLAlchemy connection URL.
# We override this in alembic/env.py from the DATABASE_URL environment variable,
# so this value is only a fallback for local Alembic CLI usage.
sqlalchemy.url = postgresql+psycopg2://codeworld:codeworld@localhost:5432/codeworld

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
